<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Property Marketplace — buy, rent, sell and discover properties with optional LawFi legal support.">

  <title>Property Marketplace — Find Your Next Property</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
  --navy:#0A1628;
  --navy2:#101D33;
  --blue:#7DBAF3;
  --blue2:#69AEEF;
  --lawfi-blue:#79B8F3;
  --white:#FFFFFF;
  --off:#F6F8FB;
  --text:#111827;
  --muted:#667085;
  --border:#E1E7EF;
  --shadow:0 14px 40px rgba(10,22,40,.08);
  --ok:#047857;
  --danger:#B91C1C;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Inter,system-ui,sans-serif;
  color:var(--text);
  background:white;
  line-height:1.5;
}

button,
input,
select,
textarea{
  font:inherit;
}

button,
a{
  touch-action:manipulation;
}

/* HEADER */

.site-header{
  height:72px;
  padding:0 clamp(18px,5vw,64px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(10px);
  z-index:20;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--navy);
  text-decoration:none;
  font-weight:800;
  font-size:18px;
}

.brand-mark{
  width:34px;
  height:34px;
  border-radius:9px;
  background:var(--navy);
  color:white;
  display:grid;
  place-items:center;
  font-weight:800;
}

.brand-muted{
  font-weight:500;
  color:var(--muted);
  margin-left:3px;
}

.desktop-nav{
  display:flex;
  align-items:center;
  gap:22px;
}

.desktop-nav a{
  color:var(--text);
  text-decoration:none;
  font-size:14px;
  font-weight:700;
}

.nav-login{
  border:1px solid var(--border);
  padding:10px 15px;
  border-radius:10px;
}

.nav-post{
  padding:11px 16px;
  background:var(--navy)!important;
  color:white!important;
  border-radius:10px;
}

.menu-btn{
  display:none;
  background:none;
  border:0;
  font-size:25px;
}

/* HERO */

.hero{
  background:linear-gradient(180deg,#F6F8FB 0%,#fff 100%);
  padding:72px 20px 38px;
}

.hero-inner{
  max-width:1180px;
  margin:auto;
}

.eyebrow,
.kicker{
  font-size:12px;
  letter-spacing:.12em;
  font-weight:800;
  color:#4B6687;
  margin:0 0 9px;
}

.hero h1{
  font-size:clamp(40px,7vw,74px);
  line-height:1.02;
  letter-spacing:-.055em;
  margin:0;
  max-width:800px;
  color:var(--navy);
}

.hero h1 span{
  color:#268AC4;
}

.hero-copy{
  max-width:620px;
  font-size:18px;
  color:var(--muted);
  margin:20px 0 32px;
}

/* SEARCH */

.search-panel{
  background:white;
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:var(--shadow);
  padding:16px;
}

.search-tabs{
  display:flex;
  gap:5px;
  margin-bottom:15px;
  overflow:auto;
}

.tab{
  border:0;
  background:transparent;
  padding:10px 15px;
  border-radius:9px;
  color:var(--muted);
  font-weight:700;
  white-space:nowrap;
}

.tab.active{
  background:var(--navy);
  color:white;
}

.search-form{
  display:grid;
  grid-template-columns:1.4fr 1fr .8fr .8fr auto;
  gap:10px;
  align-items:end;
}

.search-form label,
.list-form label{
  font-size:12px;
  color:var(--muted);
  font-weight:700;
}

.search-form input,
.search-form select,
.list-form input,
.list-form select,
.list-form textarea,
.auth-form input,
.auth-form select{
  display:block;
  width:100%;
  margin-top:6px;
  height:46px;
  border:1px solid var(--border);
  border-radius:10px;
  padding:0 12px;
  background:white;
  color:var(--text);
  outline:none;
}

.list-form textarea{
  height:110px;
  padding:12px;
  resize:vertical;
}

.search-form input:focus,
.search-form select:focus,
.list-form input:focus,
.list-form select:focus,
.list-form textarea:focus,
.auth-form input:focus,
.auth-form select:focus{
  border-color:var(--blue2);
  box-shadow:0 0 0 3px rgba(125,186,243,.18);
}

.primary-btn,
.secondary-btn{
  border:0;
  border-radius:10px;
  padding:13px 17px;
  font-weight:800;
  cursor:pointer;
  text-decoration:none;
  display:inline-block;
}

.primary-btn{
  background:var(--navy);
  color:white;
}

.secondary-btn{
  background:white;
  color:var(--navy);
  border:1px solid var(--border);
}

.search-btn{
  height:46px;
  white-space:nowrap;
}

.quick-links{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
  margin-top:16px;
  color:var(--muted);
  font-size:13px;
}

.quick-links button,
.text-btn{
  border:0;
  background:none;
  color:var(--navy);
  font-weight:700;
  cursor:pointer;
  padding:4px;
}

/* SECTIONS */

.section{
  max-width:1180px;
  margin:auto;
  padding:72px 20px;
}

.section.alt{
  max-width:none;
  background:var(--off);
}

.section.alt>*{
  max-width:1180px;
  margin-left:auto;
  margin-right:auto;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:24px;
  gap:16px;
}

.section h2{
  font-size:clamp(26px,4vw,38px);
  letter-spacing:-.035em;
  margin:0;
  color:var(--navy);
}

/* PROPERTY CARDS */

.property-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.property-card{
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  background:white;
  box-shadow:0 6px 24px rgba(10,22,40,.05);
  cursor:pointer;
  transition:.2s ease;
  display:flex;
  flex-direction:column;
}

.property-card:hover{
  transform:translateY(-3px);
  box-shadow:var(--shadow);
}

.image-wrap{
  position:relative;
}

.property-img{
  height:220px;
  width:100%;
  object-fit:cover;
  background:#e9edf2;
  display:block;
}

.save-btn{
  position:absolute;
  right:12px;
  top:12px;
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.94);
  color:var(--navy);
  font-size:22px;
  cursor:pointer;
}

.save-btn.saved{
  color:#dc2626;
}

.image-badge{
  position:absolute;
  left:12px;
  top:12px;
}

.property-body{
  padding:16px;
}

.badge{
  display:inline-block;
  background:#E9F8FF;
  color:#08739B;
  border-radius:999px;
  padding:5px 9px;
  font-size:10px;
  font-weight:800;
  letter-spacing:.04em;
}

.property-title{
  font-size:17px;
  font-weight:800;
  margin:10px 0 4px;
  color:var(--navy);
}

.price{
  font-size:20px;
  font-weight:800;
  color:var(--navy);
}

.location{
  font-size:13px;
  color:var(--muted);
  margin:5px 0 13px;
}

.meta{
  display:flex;
  gap:13px;
  color:var(--muted);
  font-size:12px;
  padding-top:12px;
  border-top:1px solid var(--border);
}

.agent-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-top:14px;
  font-size:12px;
  font-weight:700;
}

.demo-label{
  color:var(--muted);
  font-weight:600;
  font-size:10px;
}

.view-btn{
  margin-top:14px;
  width:100%;
  border:1px solid var(--navy);
  background:white;
  color:var(--navy);
  border-radius:10px;
  padding:11px;
  font-weight:800;
  cursor:pointer;
}

/* CATEGORY */

.category-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.category-card{
  text-align:left;
  background:white;
  border:1px solid var(--border);
  border-radius:15px;
  padding:22px;
  min-height:120px;
  cursor:pointer;
}

.category-card strong{
  display:block;
  color:var(--navy);
  font-size:17px;
  margin-bottom:7px;
}

.category-card span{
  color:var(--muted);
  font-size:13px;
}

/* LISTING CTA */

.cta{
  background:var(--navy);
  color:white;
  border-radius:22px;
  padding:38px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:25px;
}

.cta h2{
  margin:0;
  font-size:34px;
}

.cta p:not(.kicker){
  color:#CBD5E1;
  max-width:650px;
}

.cta .primary-btn{
  background:var(--blue);
  color:var(--navy);
  white-space:nowrap;
}

/* LISTING FORM */

.list-wrap{
  background:white;
  border:1px solid var(--border);
  border-radius:22px;
  padding:28px;
  box-shadow:var(--shadow);
}

.list-form{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.list-form .full{
  grid-column:1/-1;
}

.hint{
  font-size:12px;
  color:var(--muted);
  font-weight:500;
  margin-top:6px;
}

.photo-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.photo-box{
  border:1px dashed var(--border);
  border-radius:12px;
  min-height:92px;
  background:var(--off);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:10px;
  text-align:center;
  font-size:12px;
  color:var(--muted);
  position:relative;
  overflow:hidden;
}

.photo-box img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

.photo-box button{
  position:absolute;
  top:6px;
  right:6px;
  border:0;
  background:white;
  border-radius:50%;
  width:26px;
  height:26px;
  cursor:pointer;
  z-index:1;
}

.status-msg{
  margin-top:14px;
  padding:12px 14px;
  border-radius:12px;
  font-weight:600;
  font-size:14px;
}

.status-msg.ok{
  background:#ECFDF5;
  color:var(--ok);
}

.status-msg.err{
  background:#FEF2F2;
  color:var(--danger);
}

/* LAWFI */

.lawfi-section{
  background:var(--navy);
  color:white;
  max-width:none;
  padding:82px 20px;
}

.lawfi-inner{
  max-width:1180px;
  margin:auto;
}

.lawfi-kicker{
  color:var(--lawfi-blue);
  font-size:13px;
  letter-spacing:.18em;
  font-weight:800;
  margin:0 0 10px;
}

.lawfi-heading{
  color:white!important;
  font-size:clamp(34px,6vw,58px)!important;
  line-height:1.03;
  max-width:750px;
}

.lawfi-intro{
  color:#D5DFEC;
  max-width:760px;
  font-size:17px;
  margin:18px 0 34px;
}

.lawfi-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.lawfi-card{
  background:white;
  border:3px solid #DDE5EE;
  border-radius:24px;
  padding:30px;
  min-height:230px;
  color:var(--navy);
  transition:.2s ease;
}

.lawfi-card:hover{
  transform:translateY(-3px);
  border-color:var(--lawfi-blue);
}

.lawfi-icon{
  font-size:30px;
  margin-bottom:15px;
}

.lawfi-card h3{
  margin:0 0 12px;
  color:var(--navy);
  font-size:20px;
  line-height:1.2;
}

.lawfi-card p{
  margin:0;
  color:#6B7789;
  font-size:15px;
  line-height:1.7;
}

.lawfi-actions{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:30px;
}

.lawfi-primary{
  background:var(--lawfi-blue);
  color:var(--navy);
  padding:15px 20px;
  border-radius:12px;
  font-weight:800;
  text-decoration:none;
}

.lawfi-secondary{
  color:white;
  border:1px solid rgba(255,255,255,.35);
  padding:15px 20px;
  border-radius:12px;
  font-weight:800;
  text-decoration:none;
}

/* LOGIN / ACCOUNT */

.account-panel{
  background:var(--off);
  border:1px solid var(--border);
  border-radius:22px;
  padding:28px;
}

.account-box{
  max-width:700px;
  margin:auto;
  text-align:center;
}

.account-box h2{
  color:var(--navy);
}

.account-box p{
  color:var(--muted);
}

.account-actions{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  margin-top:20px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.52);
  display:grid;
  place-items:center;
  padding:18px;
  z-index:50;
}

.hidden{
  display:none!important;
}

.modal-card{
  background:white;
  max-width:650px;
  width:100%;
  max-height:90vh;
  overflow:auto;
  border-radius:22px;
  padding:28px;
  position:relative;
}

.modal-close{
  position:absolute;
  right:15px;
  top:12px;
  border:0;
  background:var(--off);
