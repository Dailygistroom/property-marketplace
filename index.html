<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Property Marketplace — find, buy, rent and list properties with LawFi legal support.">
<title>Property Marketplace — Find Your Next Property</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#0A1628;
  --blue:#38BDF8;
  --lawfi-blue:#78B8F5;
  --white:#fff;
  --off:#F7F8FA;
  --text:#111827;
  --muted:#6B7280;
  --border:#E5E7EB;
  --shadow:0 14px 40px rgba(10,22,40,.08);
  --ok:#047857;
  --danger:#B91C1C;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Inter,system-ui,sans-serif;
  color:var(--text);
  background:#fff;
  line-height:1.5;
}
button,input,select,textarea{font:inherit}
button,a{touch-action:manipulation}

.site-header{
  height:72px;
  padding:0 clamp(18px,5vw,64px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(10px);
  z-index:20;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--navy);
  text-decoration:none;
  font-weight:800;
  font-size:18px;
}
.brand-mark{
  width:32px;
  height:32px;
  border-radius:9px;
  background:var(--navy);
  color:white;
  display:grid;
  place-items:center;
}
.brand-muted{
  font-weight:500;
  color:var(--muted);
  margin-left:3px;
}

.desktop-nav{
  display:flex;
  align-items:center;
  gap:22px;
}
.desktop-nav a{
  color:var(--text);
  text-decoration:none;
  font-size:14px;
  font-weight:600;
}
.nav-post{
  padding:11px 16px;
  background:var(--navy)!important;
  color:white!important;
  border-radius:10px;
}
.auth-actions{display:flex}
.account-btn{
  padding:10px 14px;
  border:1px solid var(--border);
  background:white;
  color:var(--navy);
  border-radius:10px;
  font-weight:800;
  cursor:pointer;
}
.account-btn.logged{
  background:var(--navy);
  color:white;
}
.menu-btn{
  display:none;
  background:none;
  border:0;
  font-size:25px;
}

.hero{
  background:linear-gradient(180deg,#F7F8FA 0%,#fff 100%);
  padding:72px 20px 38px;
}
.hero-inner{
  max-width:1180px;
  margin:auto;
}
.eyebrow,.kicker{
  font-size:12px;
  letter-spacing:.12em;
  font-weight:800;
  color:#4B6687;
  margin:0 0 9px;
}
.hero h1{
  font-size:clamp(40px,7vw,74px);
  line-height:1.02;
  letter-spacing:-.055em;
  margin:0;
  max-width:800px;
  color:var(--navy);
}
.hero h1 span{color:#1E91C4}
.hero-copy{
  max-width:620px;
  font-size:18px;
  color:var(--muted);
  margin:20px 0 32px;
}

.search-panel{
  background:white;
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:var(--shadow);
  padding:16px;
}
.search-tabs{
  display:flex;
  gap:5px;
  margin-bottom:15px;
  overflow:auto;
}
.tab{
  border:0;
  background:transparent;
  padding:10px 15px;
  border-radius:9px;
  color:var(--muted);
  font-weight:700;
  white-space:nowrap;
  cursor:pointer;
}
.tab.active{
  background:var(--navy);
  color:white;
}

.search-form{
  display:grid;
  grid-template-columns:1.4fr 1fr .8fr .8fr auto;
  gap:10px;
  align-items:end;
}
.search-form label,
.list-form label{
  font-size:12px;
  color:var(--muted);
  font-weight:700;
}
.search-form input,
.search-form select,
.list-form input,
.list-form select,
.list-form textarea{
  display:block;
  width:100%;
  margin-top:6px;
  height:46px;
  border:1px solid var(--border);
  border-radius:10px;
  padding:0 12px;
  background:white;
  color:var(--text);
  outline:none;
}
.list-form textarea{
  height:110px;
  padding:12px;
  resize:vertical;
}
.search-form input:focus,
.search-form select:focus,
.list-form input:focus,
.list-form select:focus,
.list-form textarea:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(56,189,248,.15);
}

.primary-btn,
.secondary-btn{
  border-radius:10px;
  padding:13px 17px;
  font-weight:800;
  cursor:pointer;
  text-decoration:none;
  display:inline-flex;
  justify-content:center;
  align-items:center;
}
.primary-btn{
  background:var(--navy);
  color:white;
  border:0;
}
.secondary-btn{
  background:white;
  color:var(--navy);
  border:1px solid var(--border);
}
.search-btn{
  height:46px;
  white-space:nowrap;
}

.section{
  max-width:1180px;
  margin:auto;
  padding:72px 20px;
}
.section.alt{
  max-width:none;
  background:var(--off);
}
.section.alt>*{
  max-width:1180px;
  margin-left:auto;
  margin-right:auto;
}
.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:24px;
  gap:16px;
}
.section h2{
  font-size:clamp(26px,4vw,38px);
  letter-spacing:-.035em;
  margin:0;
  color:var(--navy);
}
.text-btn{
  border:0;
  background:none;
  color:var(--navy);
  font-weight:700;
  cursor:pointer;
}

.property-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}
.property-card{
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  background:white;
  box-shadow:0 6px 24px rgba(10,22,40,.05);
  cursor:pointer;
  display:flex;
  flex-direction:column;
}
.property-card:hover{
  transform:translateY(-3px);
  box-shadow:var(--shadow);
}
.image-wrap{position:relative}
.property-img{
  height:220px;
  width:100%;
  object-fit:cover;
  background:#e9edf2;
  display:block;
}
.save-btn{
  position:absolute;
  right:12px;
  top:12px;
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.94);
  color:var(--navy);
  font-size:22px;
  cursor:pointer;
}
.save-btn.saved{color:#dc2626}
.image-badge{
  position:absolute;
  left:12px;
  top:12px;
}
.property-body{padding:16px}
.badge{
  display:inline-block;
  background:#E9F8FF;
  color:#08739B;
  border-radius:999px;
  padding:5px 9px;
  font-size:10px;
  font-weight:800;
}
.property-title{
  font-size:17px;
  font-weight:800;
  margin:10px 0 4px;
  color:var(--navy);
}
.price{
  font-size:20px;
  font-weight:800;
  color:var(--navy);
}
.location{
  font-size:13px;
  color:var(--muted);
  margin:5px 0 13px;
}
.meta{
  display:flex;
  gap:13px;
  color:var(--muted);
  font-size:12px;
  padding-top:12px;
  border-top:1px solid var(--border);
}
.agent-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-top:14px;
  font-size:12px;
  font-weight:700;
}
.demo-label{
  color:var(--muted);
  font-size:10px;
}
.view-btn{
  margin-top:14px;
  width:100%;
  border:1px solid var(--navy);
  background:white;
  color:var(--navy);
  border-radius:10px;
  padding:11px;
  font-weight:800;
  cursor:pointer;
}

.category-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}
.category-card{
  text-align:left;
  background:white;
  border:1px solid var(--border);
  border-radius:15px;
  padding:22px;
  min-height:120px;
  cursor:pointer;
}
.category-card strong{
  display:block;
  color:var(--navy);
  font-size:17px;
  margin-bottom:7px;
}
.category-card span{
  color:var(--muted);
  font-size:13px;
}

/* ADD PROPERTY LISTING */
.cta{
  background:var(--navy);
  color:white;
  border-radius:22px;
  padding:38px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:25px;
}
.cta h2{
  margin:0;
  font-size:34px;
  color:white;
}
.cta p:not(.kicker){
  color:#CBD5E1;
  max-width:650px;
}
.cta .kicker{color:var(--lawfi-blue)}
.cta .primary-btn{
  background:var(--blue);
  color:var(--navy);
  white-space:nowrap;
}

/* LISTING FORM */
.list-wrap{
  background:white;
  border:1px solid var(--border);
  border-radius:22px;
  padding:28px;
  box-shadow:var(--shadow);
}
.list-form{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}
.list-form .full{grid-column:1/-1}
.listing-hidden{display:none!important}
.hint{
  font-size:12px;
  color:var(--muted);
  font-weight:500;
  margin-top:6px;
}
.photo-row{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.photo-box{
  border:1px dashed var(--border);
  border-radius:12px;
  min-height:92px;
  background:var(--off);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px;
  text-align:center;
  font-size:12px;
  color:var(--muted);
  position:relative;
  overflow:hidden;
}
.photo-box img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}
.photo-box button{
  position:absolute;
  top:6px;
  right:6px;
  border:0;
  background:white;
  border-radius:50%;
  width:26px;
  height:26px;
  cursor:pointer;
  z-index:2;
}

.status-msg{
  margin-top:14px;
  padding:12px 14px;
  border-radius:12px;
  font-weight:600;
  font-size:14px;
}
.status-msg.ok{
  background:#ECFDF5;
  color:var(--ok);
}
.status-msg.err{
  background:#FEF2F2;
  color:var(--danger);
}

/* LAWFI */
.lawfi-box{
  background:#0B1426;
  color:#fff;
  border-radius:24px;
  padding:36px 32px 32px;
  box-shadow:0 18px 40px rgba(11,20,38,.12);
}
.lawfi-kicker{
  margin:0 0 12px;
  color:var(--lawfi-blue);
  font-size:12px;
  letter-spacing:.14em;
  font-weight:800;
}
.lawfi-title{
  margin:0;
  color:#fff;
  font-size:clamp(28px,4vw,40px);
  letter-spacing:-.03em;
  line-height:1.15;
}
.lawfi-copy{
  margin:12px 0 28px;
  color:#D5DFEC;
  font-size:16px;
  max-width:680px;
}
.lawfi-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}
.lawfi-card{
  background:#fff;
  border-radius:16px;
  padding:22px 20px;
  min-height:168px;
  color:#0B1426;
  border-top:4px solid var(--lawfi-blue);
}
.lawfi-card h3{
  margin:0 0 8px;
  font-size:17px;
  line-height:1.3;
}
.lawfi-card p{
  margin:0;
  color:#4B5568;
  font-size:14px;
}
.lawfi-actions{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:24px;
}
.lawfi-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  padding:14px 18px;
  font-weight:800;
  text-decoration:none;
  cursor:pointer;
}
.lawfi-btn-primary{
  background:var(--lawfi-blue);
  color:#0B1426;
  border:0;
}
.lawfi-btn-secondary{
  background:transparent;
  color:white;
  border:1px solid rgba(255,255,255,.4);
}

/* FOOTER */
.footer{
  background:var(--off);
  border-top:1px solid var(--border);
  padding:40px max(20px,5vw);
  display:flex;
  justify-content:space-between;
  gap:30px;
  color:var(--muted);
  font-size:13px;
}
.footer-links{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
}
.footer a{
  color:var(--text);
  text-decoration:none;
}

/* MODALS */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.48);
  display:grid;
  place-items:center;
  padding:18px;
  z-index:50;
}
.hidden{display:none!important}
.modal-card{
  background:white;
  max-width:650px;
  width:100%;
  max-height:90vh;
  overflow:auto;
  border-radius:20px;
  padding:28px;
  position:relative;
}
.modal-close{
  position:absolute;
  right:15px;
  top:12px;
  border:0;
  background:var(--off);
  width:38px;
  height:38px;
  border-radius:50%;
  font-size:25px;
  cursor:pointer;
}
.detail-img{
  width:100%;
  height:300px;
  object-fit:cover;
  border-radius:13px;
}
.detail-price{
  font-size:28px;
  font-weight:800;
  color:var(--navy);
}
.detail-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin:20px 0;
}
.detail-item{
  background:var(--off);
  padding:13px;
  border-radius:10px;
}
.thumbs{
  display:flex;
  gap:8px;
  overflow:auto;
  margin:10px 0;
}
